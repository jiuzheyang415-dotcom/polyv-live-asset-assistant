  <header class="top"><span class="back">‹ &nbsp;返回列表</span><span class="divider"></span><div><div class="title">黑客松开发测试-story</div><div class="tags"><span>频道号 1000001</span><span>活动营销</span><span>纯视频</span><span>横屏</span></div></div><span id="mode" class="mode">加载中</span><div class="top-actions"><button>⌕</button><button>▢</button><button>↗</button><button class="start">开播</button></div></header>
  <div class="layout"><aside class="sidebar"><div class="side-title">▣ &nbsp;直播间管理</div><div class="nav">直播间信息</div><div class="nav">直播监控</div><div class="nav">角色设置</div><div class="nav active">直播装修</div><div class="nav">观看条件</div><div class="nav">营销互动</div><div class="nav">直播资源</div><div class="nav">合规风控</div></aside>
    <main class="workspace"><div class="sheet"><div class="tabs"><span>主题外观</span><span class="active">基础信息</span><span>功能设置</span><span>引导页</span></div><div class="body"><section class="settings"><h2>基础设置</h2><div class="field"><div class="label">直播名称</div><div class="input">黑客松开发测试-story</div></div><div class="field"><div class="label">主讲</div><div class="input">主持人</div></div><h2>播放器设置</h2><div class="field"><div class="label">播放器封面</div><div><div class="radio"><b>◉</b> 16:9　 ◯ 9:16</div><div id="player-cover" class="slot cover"><span class="plus">＋</span>点击上传图片</div><div id="player-cover-note" class="hint"></div></div></div><h2>引导页</h2><div class="field"><div class="label">直播封面</div><div><div id="live-cover" class="slot cover"><span class="plus">＋</span>点击上传图片</div><div id="live-cover-note" class="hint"></div></div></div><button class="save">保存</button></section><section class="phone-area"><div class="switches"><b>横屏</b>　竖屏　 PC</div><div class="phone"><div class="phone-bar">9:41 ▰</div><div class="phone-title">黑客松开发测试-story</div><div id="phone-video" class="phone-video">当前暂无直播</div><div class="phone-tabs"><span>聊天</span><span>直播介绍</span><span>提问</span><span>AI看</span></div><div class="phone-card">▣　黑客松开发测试-story<br><br>直播时间：2025/12/25 09:30</div></div></section></div></div></main></div>
  <script>
    async function refresh(){const [catalog,state]=await Promise.all([fetch('/api/specs').then(r=>r.json()),fetch('/api/state').then(r=>r.json())]);for(const spec of catalog.specs){const slot=document.getElementById(spec.id);if(!slot)continue;document.getElementById(spec.id+'-note').textContent=spec.note;const saved=state.saved[spec.id];if(saved){const img=document.createElement('img');img.src='/api/asset/'+spec.id+'?v='+saved.version;img.alt=spec.name+'已保存';slot.replaceChildren(img);if(spec.id==='player-cover'){const phone=document.getElementById('phone-video');const preview=img.cloneNode();phone.replaceChildren(preview)}}}}
    fetch('/health').then(r=>r.json()).then(data=>document.getElementById('mode').textContent=data.demoMode?'离线演示模式':data.saveMode==='polyv'?'真实频道模式':'在线生成 · 模拟保存');refresh();window.addEventListener('polyv-assistant:saved',refresh);
  </script>
