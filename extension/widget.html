<body><div class="app">
  <div class="head"><div class="head-top"><span class="mark"><img src="/ui-assets/avatar.png" alt=""></span><div><strong>小保 AI 直播助手</strong><small>保利威 · 直播装修素材创作</small></div><span class="stage">第一阶段</span></div><p>说出你的想法，我来帮你生成和修改。</p></div>
  <div class="session-nav"><button id="new-chat" type="button">＋ 新对话</button><button id="show-history" type="button">历史会话</button></div><div id="history-list" class="history-list"></div>
  <div id="content" class="content" aria-live="polite"><div class="date">今天 · 开始创作</div><div class="bubble bot">你好！我可以制作播放器封面和直播封面。选一个位置开始，也可以直接说出你的想法。</div><div class="starter"><button data-target="player-cover"><b>▣ 播放器封面</b><span>直播前播放器的暖场封面</span></button><button data-target="live-cover"><b>▤ 直播封面</b><span>引导页与 PC 的 16:9 封面</span></button></div></div>
  <div class="composer"><div id="upload-preview" class="upload-preview"><img id="upload-thumb" alt="参考图预览"><span id="upload-name">已添加参考图</span><button id="remove-upload" type="button" aria-label="移除参考图">移除</button></div><div class="input-wrap"><textarea id="message" placeholder="例如：做一张蓝紫科技风的播放器封面…" aria-label="描述图片需求或修改意见"></textarea><div class="tools"><label class="attach">＋ 添加参考图<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="send" class="send" type="button" disabled>发送 ↗</button></div></div><div id="footnote" class="footnote">生成后可继续修改，确认定稿后保存到演示后台</div></div>
</div><script>
  const $ = selector => document.querySelector(selector);
  let sessionId = null;
  let selectedTargetId = null;
  let pendingImage = null;
  let pendingThumbnail = null;
  let pendingImageName = null;
  let attachmentRevision = 0;
  let busy = false;
  let ready = false;
  let activeChannelId = null;
  let activeChangedWhileBusy = false;
  const content = $('#content');
  const welcome = content.innerHTML;
  let conversationPrefix = null;
  let activeStorageKey = null;
  let conversations = [];
  let activeId = null;
  let itemClock = 0;
  const conversation = () => conversations.find(item => item.id === activeId);
  const validId = id => /^[a-f0-9-]{36}$/i.test(String(id || ''));
  const newItemId = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;
  function normalizeConversation(entry) {
    if (!entry || !validId(entry.id) || !Array.isArray(entry.items)) return null;
    const createdAt = Number.isFinite(entry.createdAt) ? entry.createdAt : Date.now();
    return {
      id: entry.id,
      title: String(entry.title || '图片创作').slice(0, 100),
      createdAt,
      updatedAt: Number.isFinite(entry.updatedAt) ? entry.updatedAt : createdAt,
      items: entry.items.filter(item => item && typeof item.type === 'string').map((item, index) => ({
        ...item,
        id: typeof item.id === 'string' ? item.id : `${entry.id}:legacy:${index}`,
        at: Number.isFinite(item.at) ? item.at : createdAt + index
      }))
    };
  }
  function mergeConversations(first, second) {
    if (!first) return second;
    if (!second) return first;
    const items = new Map();
    for (const item of [...first.items, ...second.items]) {
      const previous = items.get(item.id);
      items.set(item.id, previous ? { ...previous, ...item, ...(previous.saved || item.saved ? { saved: true } : {}) } : item);
    }
    return {
      id: first.id,
      title: first.title || second.title,
      createdAt: Math.min(first.createdAt, second.createdAt),
      updatedAt: Math.max(first.updatedAt, second.updatedAt),
      items: [...items.values()].sort((a, b) => a.at - b.at || a.id.localeCompare(b.id))
    };
  }
  function mergeIntoMemory(entry) {
    const normalized = normalizeConversation(entry);
    if (!normalized) return null;
    const index = conversations.findIndex(item => item.id === normalized.id);
    const merged = mergeConversations(index < 0 ? null : conversations[index], normalized);
    if (index < 0) conversations.push(merged);
    else conversations[index] = merged;
    return merged;
  }
  function saveActive() {
    if (!activeStorageKey) return;
    try { sessionStorage.setItem(activeStorageKey, activeId || ''); } catch (_) {}
  }
  function persist() {
    if (!conversationPrefix) return;
    const current = conversation();
    if (current) {
      try {
        const key = conversationPrefix + current.id;
        const stored = normalizeConversation(JSON.parse(localStorage.getItem(key) || 'null'));
        const merged = mergeIntoMemory(mergeConversations(stored, current));
        localStorage.setItem(key, JSON.stringify(merged));
      } catch (_) {}
    }
    saveActive();
  }
  function remember(items) {
    const current = conversation();
    if (!current) return;
    for (const item of items) {
      itemClock = Math.max(Date.now(), itemClock + 1);
      current.items.push({ ...item, id: newItemId(), at: itemClock });
    }
    current.updatedAt = Date.now();
    persist();
  }
  function starterButtons() {
    content.querySelectorAll('[data-target]').forEach(button => button.onclick = () => {
      selectedTargetId = button.dataset.target;
      $('#message').value = `请帮我制作${button.querySelector('b').textContent.replace(/^[^\u4e00-\u9fa5]+/, '')}，蓝紫色科技感，简洁高级`;
      $('#message').focus();
    });
  }
  function renderHistory() {
    const list = $('#history-list');
    list.replaceChildren();
    for (const entry of [...conversations].sort((a, b) => b.updatedAt - a.updatedAt)) {
      const button = document.createElement('button');
      button.textContent = entry.title || '图片创作';
      const date = document.createElement('small');
      date.textContent = new Date(entry.updatedAt).toLocaleString('zh-CN');
      button.append(date);
      button.onclick = () => {
        if (busy || !ready) return;
        clearComposer();
        activeId = entry.id;
        sessionId = entry.id;
        selectedTargetId = null;
        persist();
        renderConversation();
        list.classList.remove('visible');
      };
      list.append(button);
    }
    if (!conversations.length) list.textContent = '暂无历史会话';
  }
  function renderConversation() {
    const current = conversation();
    content.replaceChildren();
    if (!current || !current.items.length) { content.innerHTML = welcome; starterButtons(); return; }
    const date = document.createElement('div'); date.className = 'date'; date.textContent = new Date(current.createdAt).toLocaleString('zh-CN'); content.append(date);
    for (const item of current.items) {
      if (item.type === 'message') bubble(item.text, item.role, item.attachment);
      if (item.type === 'choices' && Array.isArray(item.choices)) actions(item.choices);
      if (item.type === 'draft' && item.draft && item.target) draftCard(item.draft, item.target, false);
    }
    const lastDraft = [...current.items].reverse().find(item => item.type === 'draft' && item.draft && item.target);
    if (lastDraft && !lastDraft.saved) {
      const cards = content.querySelectorAll('.draft-card');
      const card = cards[cards.length - 1];
      if (card) addDraftActions(card, lastDraft.draft, lastDraft.target);
    }
    bottom();
  }
  function syncConversations() {
    if (!conversationPrefix) return;
    try {
      for (let index = 0; index < localStorage.length; index++) {
        const key = localStorage.key(index);
        if (!key?.startsWith(conversationPrefix)) continue;
        try { mergeIntoMemory(JSON.parse(localStorage.getItem(key) || 'null')); } catch (_) {}
      }
    } catch (_) {}
  }
  function loadConversations(channelId) {
    const scope = channelId || 'demo';
    conversationPrefix = `polyv-assistant-conversation-v2:${scope}:`;
    activeStorageKey = `polyv-assistant-active-v2:${scope}`;
    const legacyKey = `polyv-assistant-conversations-v1:${scope}`;
    let legacyActive = null;
    conversations = [];
    syncConversations();
    try {
      const legacy = JSON.parse(localStorage.getItem(legacyKey) || '{}');
      legacyActive = legacy.activeId;
      if (Array.isArray(legacy.conversations)) {
        for (const raw of legacy.conversations) {
          const entry = normalizeConversation(raw);
          if (!entry) continue;
          const key = conversationPrefix + entry.id;
          const stored = normalizeConversation(JSON.parse(localStorage.getItem(key) || 'null'));
          const merged = mergeIntoMemory(mergeConversations(stored, entry));
          localStorage.setItem(key, JSON.stringify(merged));
        }
        localStorage.removeItem(legacyKey);
      }
    } catch (_) {}
    syncConversations();
    let selected = null;
    try { selected = sessionStorage.getItem(activeStorageKey); } catch (_) {}
    const latest = [...conversations].sort((a, b) => b.updatedAt - a.updatedAt)[0];
    activeId = selected === '' ? null : conversations.some(entry => entry.id === selected) ? selected
      : conversations.some(entry => entry.id === legacyActive) ? legacyActive : latest?.id || null;
    sessionId = activeId;
    renderConversation();
    renderHistory();
    saveActive();
  }
  const bottom = () => { content.scrollTop = content.scrollHeight; };
  function bubble(message, role = 'bot', attachment = null) {
    const element = document.createElement('div');
    element.className = `bubble ${role === 'user' ? 'user' : 'bot'}`;
    element.textContent = message;
    if (attachment && /^data:image\/jpeg;base64,[a-z0-9+/=]+$/i.test(attachment.thumbnail || '') && attachment.thumbnail.length < 150_000) {
      const image = document.createElement('img');
      image.className = 'attachment';
      image.src = attachment.thumbnail;
      image.alt = attachment.name || '本轮参考图';
      element.append(image);
    }
    content.append(element);
    bottom();
    return element;
  }
  function actions(choices) {
    const row = document.createElement('div');
    row.className = 'options';
    for (const choice of choices) {
      const button = document.createElement('button');
      button.textContent = choice.name;
      button.onclick = () => send(`请帮我制作${choice.name}`, choice.id);
      row.append(button);
    }
    content.append(row);
    bottom();
  }
  function addDraftActions(card, draft, target) {
    const row = document.createElement('div');
    row.className = 'draft-actions';
    const approve = document.createElement('button');
    approve.className = 'primary';
    approve.textContent = '✓ 确认定稿';
    approve.onclick = () => send('定稿并上传', target.id, draft.version);
    const revise = document.createElement('button');
    revise.textContent = '继续修改';
    revise.onclick = () => { $('#message').focus(); $('#message').placeholder = '例如：色调再明亮一点，保留原来的构图…'; };
    row.append(approve, revise);
    card.append(row);
  }
  function draftCard(draft, target, actionable = true) {
    document.querySelectorAll('.draft-actions .primary').forEach(button => button.remove());
    const card = document.createElement('div');
    card.className = 'draft-card';
    const image = document.createElement('img');
    image.onload = bottom;
    if (/^\/api\/draft\/[a-f0-9-]{36}\/\d+$/i.test(draft.url)) image.src = draft.url;
    image.alt = `${target.name}第 ${draft.version} 版`;
    card.append(image);
    const info = document.createElement('div');
    info.className = 'draft-info';
    info.textContent = `${target.name} · 第 ${draft.version} 版 · ${draft.width}×${draft.height} px · ${Math.round(draft.bytes / 1024)} KB`;
    card.append(info);
    if (actionable) addDraftActions(card, draft, target);
    content.append(card);
    bottom();
  }
  async function send(text, explicitTargetId = null, draftVersion) {
    if (busy || !ready) return;
    text = String(text || '').trim();
    if (!text) return;
    const submittedImage = pendingImage;
    const attachment = submittedImage && pendingThumbnail ? { name: pendingImageName, thumbnail: pendingThumbnail } : null;
    const lastDraft = [...(conversation()?.items || [])].reverse().find(item => item.type === 'draft' && item.draft);
    const confirmedVersion = draftVersion ?? lastDraft?.draft?.version;
    busy = true;
    window.parent.postMessage({ type: 'polyv-assistant:working', working: true }, '*');
    if (!conversation()) content.replaceChildren();
    $('#send').disabled = true;
    $('#file').disabled = true;
    bubble(text, 'user', attachment);
    const loading = document.createElement('div');
    loading.className = 'bubble bot loading';
    loading.innerHTML = '<i></i><i></i><i></i>';
    content.append(loading);
    bottom();
    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, channelId: activeChannelId, targetId: explicitTargetId || selectedTargetId, message: text, screenshot: submittedImage, draftVersion: confirmedVersion })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '请求失败');
      const replacedSession = Boolean(conversation() && conversation().id !== result.sessionId);
      sessionId = result.sessionId;
      if (!conversation() || conversation().id !== sessionId) {
        activeId = sessionId;
        conversations.push({ id: sessionId, title: text.slice(0, 32), createdAt: Date.now(), updatedAt: Date.now(), items: [] });
      }
      selectedTargetId = null;
      loading.remove();
      bubble(result.assistantMessage);
      if (result.choices) actions(result.choices);
      if (result.status === 'draft') draftCard(result.draft, result.target);
      if (result.status === 'saved') {
        document.querySelectorAll('.draft-actions .primary').forEach(button => button.remove());
        const previous = [...conversation().items].reverse().find(item => item.type === 'draft' && item.draft);
        if (previous) previous.saved = true;
      }
      const items = [
        { type: 'message', role: 'user', text, ...(attachment ? { attachment } : {}) },
        { type: 'message', role: 'bot', text: result.assistantMessage }
      ];
      if (result.choices) items.push({ type: 'choices', choices: result.choices.map(({ id, name }) => ({ id, name })) });
      if (result.status === 'draft') items.push({ type: 'draft', draft: result.draft, target: result.target, saved: false });
      remember(items);
      if (replacedSession) renderConversation();
      renderHistory();
      if (result.status === 'saved') window.parent.postMessage({ type: 'polyv-assistant:saved', detail: { targetId: result.target.id, saved: result.saved } }, '*');
      if (result.status !== 'need_target') clearAttachment();
    } catch (error) {
      loading.remove();
      bubble(`操作未完成：${error.message}`);
      if (!$('#message').value.trim()) $('#message').value = text;
    } finally {
      busy = false;
      window.parent.postMessage({ type: 'polyv-assistant:working', working: false }, '*');
      $('#send').disabled = !ready;
      $('#file').disabled = false;
      if (activeChangedWhileBusy) { activeChangedWhileBusy = false; renderConversation(); }
      bottom();
    }
  }
  function clearAttachment() {
    attachmentRevision++;
    pendingImage = null;
    pendingThumbnail = null;
    pendingImageName = null;
    $('#file').value = '';
    $('#upload-preview').classList.remove('visible');
  }
  function clearComposer() {
    clearAttachment();
    $('#message').value = '';
    $('#message').placeholder = '例如：做一张蓝紫科技风的播放器封面…';
  }
  function showUpload(data, thumbnail, name) {
    pendingImage = data;
    pendingThumbnail = thumbnail;
    pendingImageName = name;
    $('#upload-thumb').src = thumbnail;
    $('#upload-name').textContent = name;
    $('#upload-preview').classList.add('visible');
  }
  async function readImage(file) {
    if (busy || !file || !/^image\/(png|jpeg|webp)$/.test(file.type)) return;
    const revision = ++attachmentRevision;
    try {
      const bitmap = await createImageBitmap(file);
      if (revision !== attachmentRevision) { bitmap.close(); return; }
      const scale = Math.min(1, 2400 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const thumb = document.createElement('canvas');
      const thumbScale = Math.min(1, 240 / Math.max(bitmap.width, bitmap.height));
      thumb.width = Math.round(bitmap.width * thumbScale);
      thumb.height = Math.round(bitmap.height * thumbScale);
      thumb.getContext('2d').drawImage(bitmap, 0, 0, thumb.width, thumb.height);
      bitmap.close();
      let data = canvas.toDataURL('image/jpeg', .88);
      if (data.length > 7_500_000) data = canvas.toDataURL('image/jpeg', .68);
      if (revision === attachmentRevision) showUpload(data, thumb.toDataURL('image/jpeg', .62), file.name || '已粘贴图片');
    } catch (error) { if (revision === attachmentRevision) bubble('图片处理失败：' + error.message); }
  }
  starterButtons();
  $('#new-chat').onclick = () => { if (busy || !ready) return; clearComposer(); activeId = null; sessionId = null; selectedTargetId = null; persist(); renderConversation(); $('#history-list').classList.remove('visible'); };
  $('#show-history').onclick = () => { syncConversations(); renderHistory(); $('#history-list').classList.toggle('visible'); };
  $('#send').onclick = () => { const text = $('#message').value.trim() || (pendingImage ? '请参考这张图，帮我生成适合当前素材位的图片' : ''); if (text) { $('#message').value = ''; send(text); } };
  $('#message').onkeydown = event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); $('#send').click(); } };
  $('#message').onpaste = event => { if (busy) return; const item = [...(event.clipboardData?.items || [])].find(x => x.type.startsWith('image/')); if (item) { event.preventDefault(); readImage(item.getAsFile()); } };
  $('#file').onchange = event => readImage(event.target.files?.[0]);
  $('#remove-upload').onclick = clearAttachment;
  window.addEventListener('storage', event => {
    if (!conversationPrefix || !event.key?.startsWith(conversationPrefix) || !event.newValue) return;
    try {
      const incoming = normalizeConversation(JSON.parse(event.newValue));
      if (!incoming) return;
      const stored = normalizeConversation(JSON.parse(localStorage.getItem(event.key) || 'null'));
      const merged = mergeIntoMemory(mergeConversations(stored, incoming));
      if (JSON.stringify(merged) !== JSON.stringify(stored)) localStorage.setItem(event.key, JSON.stringify(merged));
      if (activeId === incoming.id) {
        if (busy) activeChangedWhileBusy = true;
        else renderConversation();
      }
      renderHistory();
    } catch (_) {}
  });
  fetch('/health').then(response => response.json()).then(info => {
    const realSaveMode = !info.demoMode && info.saveMode === 'polyv';
    const requestedChannelId = new URLSearchParams(location.search).get('channelId');
    activeChannelId = realSaveMode ? requestedChannelId || info.channelId : null;
    if (realSaveMode && !(info.channelIds || [info.channelId]).includes(activeChannelId)) throw new Error('当前频道未配置为可用频道。');
    $('#footnote').textContent = info.demoMode ? '离线演示模式 · 图片依据文字生成，参考图内容不会被识别' : realSaveMode ? `确认定稿后保存到保利威频道 ${activeChannelId}` : '在线生成 · 确认定稿后保存到演示后台';
    loadConversations(activeChannelId || (info.demoMode ? 'demo' : 'local'));
    ready = true;
    $('#send').disabled = false;
  }).catch(error => { $('#footnote').textContent = error.message || '无法连接本地助手。'; });
</script></body></html>
